# RDR2 "ultra realism" — vkBasalt post-processing.  Toggle ON/OFF in-game: Home key.
# effects = cas ONLY.  deband was TESTED 2026-06-24 and CRASHES the game at ~125s
# (do not re-add it). CAS = AMD FidelityFX Contrast-Adaptive Sharpening: restores
# micro-detail lost to DLSS/TAA softness (foliage, fur, fabric, distant terrain)
# without halos. Raise casSharpness toward 0.65 for more bite, 0.35 for subtler.
# enableOnLaunch applies it from frame 1 even if the Home toggle doesn't register.
effects = cas
casSharpness = 0.50
enableOnLaunch = True
toggleKey = Home
