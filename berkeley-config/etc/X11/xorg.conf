Section "ServerLayout"
    Identifier "Layout0"
    Screen 0 "Screen0" 0 0
EndSection

Section "Monitor"
    Identifier "HDMI-A-0"
    VendorName "Unknown"
    ModelName "Unknown"
    HorizSync 30.0 - 83.0
    VertRefresh 56.0 - 76.0
    Option "DPMS"
    Option "PreferredMode" "1920x1080"
EndSection

Section "Device"
    Identifier "Device0"
    Driver "amdgpu"
    VendorName "AMD"
    BoardName "Radeon RX 5600 XT"
    Option "TearFree" "on"
    Option "DRI" "3"
    Option "AccelMethod" "glamor"
EndSection

Section "Screen"
    Identifier "Screen0"
    Device "Device0"
    Monitor "HDMI-A-0"
    DefaultDepth 24
    SubSection "Display"
        Modes "1920x1080"
        Depth 24
    EndSubSection
EndSection
